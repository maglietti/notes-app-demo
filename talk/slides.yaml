# Deck spec for "Confidently Wrong: Handing a Coding Agent the Database Anyway".
# Build from the repository root with the mariadb-pptx skill:
#   pptx-skill check talk/slides.yaml
#   pptx-skill build talk/slides.yaml -o talk/slides.pptx --strict
# Images in talk/captures/ are real outputs; see working/exp-b/findings.md,
# "Captures for the deck". The outline is working/outline.md.

title: "Confidently Wrong: Handing a Coding Agent the Database Anyway"
footer: MariaDB Public

slides:
  # Beat 1: You know that note (1:45)
  - layout: title
    title: |
      Confidently Wrong:
      Handing a Coding Agent the Database Anyway
    presenter: |
      Michael Aglietti
      Head of Developer Relations, MariaDB
      All Things Open 2026, Databases track
    notes: >-
      [0:10] Good morning. I'm Michael, and I run developer relations at
      MariaDB. Let's start with a folder you probably have too.

  - layout: title-body-dark
    title: A year of daily notes is 220 Markdown files
    pictures:
      - image: talk/captures/ls.png
        left_in: 0.5
        top_in: 1.3
        width_in: 9.0
    notes: >-
      [0:45] I write a note every working day. One Markdown file, named for
      the date. When the list gets too long, I move a quarter into an archive
      folder and have an LLM write a summary of it. After a year, that's 220
      files. Maybe yours is notes, maybe it's runbooks or meeting minutes. Same
      problem.

  - layout: title-body-dark
    title: rg can't find a note I only half remember
    pictures:
      - image: talk/captures/rg.png
        left_in: 1.0
        top_in: 1.4
        width_in: 8.0
    textboxes:
      - text: "I can ask my coding agent to look. It works, and it spends tokens I'd rather spend on code."
        left_in: 1.0
        top_in: 3.3
        width_in: 8.0
        height_in: 1.0
        size_pt: 20
        color: white
    notes: >-
      [0:50] In April I wrote a good note about testing a migration without a
      copy of production. I remember that it was good, and roughly what it
      said. I don't remember the words. So rg finds nothing for the way I'd
      say it today, and twenty files for the one word I'm sure of. I can ask
      my coding agent to go through the folder, and it'll find it. But it
      reads a lot of files to get there, and I'd rather spend those tokens on
      code.

  # Beat 2: Why not have an agent build it? (0:45)
  - layout: statement-teal
    title: Why not have a coding agent build the fix?
    notes: >-
      [0:25] So here's the idea. If my agent can search my notes, why not have
      it build the thing that searches them? I write a short spec. The agent
      sets up its own database server, builds an index that searches by
      meaning, and hands me an app. When I first said that out loud, it
      sounded a bit crazy.

  - layout: quote
    quote: Good ideas are always crazy until they're not.
    attribution: Larry Page
    notes: >-
      [0:20] Larry Page said that. So let's try it. Come take this walk with
      me.

  # Beat 3: One page (2:00)
  - layout: title-body-dark
    title: I wrote one page about what I want
    pictures:
      - image: talk/captures/spec-why.png
        left_in: 1.2
        top_in: 1.15
        height_in: 3.85
    notes: >-
      [0:45] Before any agent touched this, I wrote it down. One page, about
      fifteen minutes. It starts with why: I remember that a note was good,
      and roughly what it was about. And one rule I won't bend: everything
      runs on my laptop. I don't want my notes to leave my laptop. So the
      embeddings come from Ollama, locally, and the database is MariaDB 12.3,
      the current long-term support release.

  - layout: title-body-dark
    title: The spec lists what to build now and what can wait
    pictures:
      - image: talk/captures/spec-must.png
        left_in: 1.2
        top_in: 1.15
        height_in: 3.85
    notes: >-
      [0:40] Eight must-haves. Search by meaning, search for exact words, open
      the note in nvim, because I keep writing in my editor. Search from the
      command line. And number eight: keybindings like lazygit, because that's
      the kind of TUI I use every day. The nice-to-haves sit in their own
      list, and my prompt tells the agent to skip them. That keeps the build
      to what I asked for.

  - layout: title-body-dark
    title: The spec ends with a check the app must pass
    pictures:
      - image: talk/captures/spec-done.png
        left_in: 0.5
        top_in: 1.4
        width_in: 9.0
    textboxes:
      - text: "The April 14 note never uses those words. If the app finds it, the app searches by meaning."
        left_in: 0.6
        top_in: 3.4
        width_in: 8.8
        height_in: 1.0
        size_pt: 20
        color: white
    notes: >-
      [0:35] And it ends with a check. Done when every note is in the
      database, and when I search for "testing a migration without a copy of
      production", my April 14 note is in the top three. That note is about
      three people who asked me how to rehearse a database move when they
      can't use production data. It never says "testing a migration without
      a copy of production". That's the point.

  # Beat 4: First try: fast and confidently wrong (2:30)
  # Story integrity: no skills, no plugin, no "why" in this beat.
  - layout: title-body
    title: "First try: Claude Haiku 4.5 designs the database"
    body:
      - "1. Design the MariaDB schema and save it as working/notes_app.sql"
      - "2. Write the SQL to search my notes by meaning and by exact words"
      - "3. Tell me how safe the schema is to run more than once"
    notes: >-
      [0:30] First the database. I gave it to Claude Haiku 4.5, the small,
      fast kind a lot of us use for everyday work. Three asks: the schema, the
      search, and how safe it is to run the schema twice. It answered in
      seconds, and it sounded sure of every part. I ran the same job a few
      times, and then I ran what it wrote on a real MariaDB 12.3 server.

  - layout: title-body-dark
    title: Its search ran and put the exact match last
    pictures:
      - image: talk/captures/haiku-search.png
        left_in: 1.5
        top_in: 1.3
        width_in: 7.0
    textboxes:
      - text: "The search used another database's distance operator. In MariaDB, that operator asks whether two values are identical."
        left_in: 1.5
        top_in: 3.75
        width_in: 7.0
        height_in: 0.9
        size_pt: 16
        color: white
    notes: >-
      [1:00] I tested the search on three notes, where one matches my query
      exactly. It ran. No error, no warning. And the exact match came back
      last. The agent used the distance operator from another database.
      MariaDB has the same symbol, but here it asks a different question: are
      these two values identical? Not identical scores zero, identical scores
      one, and sorting smallest first puts the best match at the bottom. A
      search that ignores meaning, and nothing in the log says so.

  - layout: title-body-dark
    title: The agent called reruns safe, but they skip changes
    pictures:
      - image: talk/captures/rerun.png
        left_in: 0.5
        top_in: 1.3
        width_in: 9.0
    notes: >-
      [1:00] Then I asked about running the schema twice. "Fully safe and
      idempotent." So I tried it. My quarterly summaries don't have a date,
      and the schema requires one. I made the date column optional and ran
      the script again. MariaDB says the table already exists, and the column
      is still required. My change didn't apply, and nothing told me. That's
      confidently wrong: fast, sure, and wrong in ways that still run. It
      knows databases in general. It doesn't know the one I use.

  # Beat 5: Plug in MariaDB (2:00)
  - layout: two-column
    title: MariaDB's plugin adds knowledge and a live server
    heading1: "Skills: what the agent knows"
    body1:
      - "MariaDB's current syntax, in the agent's context"
      - The order statements have to run in
      - The mistakes the docs don't warn you about
    heading2: "MCP server and sandbox: where it checks"
    body2:
      - Runs SQL and reads the schema on a live server
      - Deploys a MariaDB sandbox in one tool call
      - No Docker and no root
    notes: >-
      [1:00] So the agent needed two things: to know MariaDB as it is today,
      and somewhere to try its work. MariaDB's plugin brings both. The skills
      put current MariaDB knowledge into the agent's context. The LLM itself
      doesn't change. It just has the right reference open. The MCP server
      gives the agent a live connection, and when there's no database yet,
      it deploys a sandbox: a real MariaDB server on my laptop, no Docker, no
      root. (If asked about SQLite: for one person and a few hundred notes,
      SQLite with sqlite-vec would work. But the sandbox makes a real server
      free to start, full-text and vector search are both built into MariaDB
      12.3, and the app and my agent search the same index.)

  - layout: title-body-dark
    title: Install in two commands, then choose what it can reach
    textboxes:
      - text: "/plugin marketplace add mariadb/ai-plugins\n/plugin install dev@mariadb"
        left_in: 0.8
        top_in: 1.2
        width_in: 8.4
        height_in: 0.8
        size_pt: 20
        font: Courier New
        color: blue_lagoon
      - text: "$ mariadb-shell -- mcp setup --addPaths=~/notes-app"
        left_in: 0.8
        top_in: 2.15
        width_in: 8.8
        height_in: 0.4
        size_pt: 15
        font: Courier New
        color: electric_eel
      - text: "Folders the MCP server may read and write"
        left_in: 0.8
        top_in: 2.5
        width_in: 8.8
        height_in: 0.35
        size_pt: 15
        color: white
      - text: "$ mariadb-shell -- mcp setup --addConnection=demo@localhost:3306"
        left_in: 0.8
        top_in: 3.0
        width_in: 8.8
        height_in: 0.4
        size_pt: 15
        font: Courier New
        color: electric_eel
      - text: "Database servers it may connect to, with the password kept by setup"
        left_in: 0.8
        top_in: 3.35
        width_in: 8.8
        height_in: 0.35
        size_pt: 15
        color: white
      - text: "Both lists start empty. The agent adds only the sandboxes it deploys."
        left_in: 0.8
        top_in: 4.0
        width_in: 8.4
        height_in: 0.5
        size_pt: 18
        bold: true
        color: white
    notes: >-
      [1:00] Two commands in Claude Code install the plugin. Then one more
      step, and the DBAs in the room will like this one. The MCP server starts
      out allowed to reach nothing: no folders, no databases. You run setup
      once and give it two lists. The folders it may read and write, here my
      project. And the database servers it may connect to. Setup stores the
      password, so it never shows up in a prompt. The agent can't add a
      folder or another server. The one thing it adds is a sandbox it
      deploys itself, inside a folder you allowed. The DevHub at ai-plugins.mariadb.org lists
      the skills, the tools, and the other harnesses it runs in.

  # Beat 6: Same small agent, right this time (1:45)
  - layout: title-body-dark
    title: With the skills loaded, the exact match comes first
    pictures:
      - image: talk/captures/haiku-fixed.png
        left_in: 1.5
        top_in: 1.3
        width_in: 7.0
    textboxes:
      - text: "Same agent, same prompt. Asked about reruns, it now says: “Second run wipes the database.”"
        left_in: 1.5
        top_in: 3.75
        width_in: 7.0
        height_in: 0.9
        size_pt: 16
        color: white
    notes: >-
      [1:00] Same agent, Claude Haiku 4.5. Same prompt. This time with three
      MariaDB skills loaded. Same three test notes, and the exact match comes
      first, using MariaDB's own vector distance, in the form the vector
      index expects. The two schema errors are gone too. And the rerun
      answer is honest now: a second run wipes the database. A few things
      were still off, like the size of the embeddings my model returns. A
      live server catches those the moment the schema runs, which is why the
      sandbox matters.

  - layout: title-body-dark
    title: Check that the agent actually loaded the skill
    pictures:
      - image: talk/captures/a3-skill.png
        left_in: 2.0
        top_in: 1.3
        width_in: 6.0
    textboxes:
      - text: "Haiku 4.5 didn't load the skills on its own, even when my prompt asked it to. I loaded them myself."
        left_in: 1.0
        top_in: 3.0
        width_in: 8.0
        height_in: 0.8
        size_pt: 18
        color: white
      - text: "Skill lines carry knowledge. Tool calls act on the server."
        left_in: 1.0
        top_in: 3.9
        width_in: 8.0
        height_in: 0.5
        size_pt: 18
        bold: true
        color: electric_eel
    notes: >-
      [0:45] One practical tip. A loaded skill shows up in the transcript as
      a line like this one. With the plugin installed, Haiku didn't load the
      skills on its own, even when my prompt said to use them. So I loaded
      them myself, and that's the run you just saw. Read your transcript with
      that split in mind: Skill lines are what the agent knew, tool calls are
      what it did on the server. If there's no Skill line, the LLM is working
      from memory.

  # Beat 7: The full build (4:00)
  - layout: title-body-dark
    title: For the full build, I switched to Claude Opus 5.5
    pictures:
      - image: talk/captures/runc-prompt.png
        left_in: 0.5
        top_in: 1.25
        width_in: 9.0
    textboxes:
      - text: "Name the file. Number the steps. Say “in order”."
        left_in: 0.6
        top_in: 4.0
        width_in: 8.8
        height_in: 0.5
        size_pt: 20
        bold: true
        color: electric_eel
      - text: "Next in the transcript: four MariaDB Skill lines, before the agent wrote anything."
        left_in: 0.6
        top_in: 4.5
        width_in: 8.8
        height_in: 0.5
        size_pt: 16
        color: white
    notes: >-
      [0:50] For the whole app, I switched to the bigger agent, Claude Opus
      5.5, with the same plugin. This is the real prompt. Here's how I write a
      prompt so the work lands where I want it. Name the file you want, not
      the result you picture. Number the steps. And say "in order" when the
      order matters, because you can't run a schema on a server that doesn't
      exist yet. And look at the transcript: four MariaDB skills loaded
      before it wrote anything.

  - layout: chart-stats
    title: The agent built the app in about seven minutes
    subtitle: Two prompts, Claude Opus 5.5 with the MariaDB plugin
    body:
      - Designed the schema and deployed a sandbox
      - Imported all 220 notes, 351 sections embedded
      - Built the terminal app and the search command
    stats_heading: Time per prompt
    stat1_value: "2:12"
    stat1_label: Schema and sandbox, plus one question for me
    stat2_value: "5:07"
    stat2_label: App, import, and the "Done when" check
    notes: >-
      [0:40] About two minutes for the schema and a running sandbox. That
      includes one question: it found an old server already on that port,
      with its data folder gone, and asked me before stopping it. I like that.
      Then five minutes for the app, the import of all 220 notes, and the
      check. The schema uses MariaDB's own vector type and vector index.

  - layout: title-body-dark
    title: The agent tested its own work and fixed what it found
    pictures:
      - image: talk/captures/selftest.png
        left_in: 0.5
        top_in: 1.4
        width_in: 9.0
    notes: >-
      [1:20] I didn't ask for tests beyond the check, but the agent wrote them
      anyway. It ran the import twice, added, changed, and deleted a test
      note, and drove the TUI headlessly. Two things broke, and it fixed both
      without stopping to ask. The install came out empty, so it switched the
      build backend. And exact-word search returned nothing for any query
      with short words like "a" or "of", because MariaDB's full-text index
      doesn't store them. It found that by testing its own app, not because I
      told it to look.

  - layout: title-body-dark
    title: My check passes, and I can rerun it myself
    pictures:
      - image: talk/captures/pass.png
        left_in: 0.5
        top_in: 1.4
        width_in: 9.0
    textboxes:
      - text: "April 14 ranks 1st, just ahead of the Q2 summary that describes the same conversation."
        left_in: 0.6
        top_in: 3.5
        width_in: 8.8
        height_in: 0.8
        size_pt: 18
        color: white
    notes: >-
      [1:10] And the check from my spec: April 14 is first. The Q2 summary is
      right behind it, which is fair, because it describes the same hallway
      conversation. The margin is small, so this is a check I'll keep
      running. And it's a command I can run myself. I don't have to ask the
      agent whether it passed. (If asked: in earlier builds the same check
      caught a 5th place and a thin 3rd, and each time the agent fixed how it
      phrased the query for the embedding model.)

  # Beat 8: Now I just ask (1:45)
  - layout: title-body-dark
    title: Now I type what I remember, and the note comes up
    pictures:
      - image: talk/captures/tui-search.png
        left_in: 0.75
        top_in: 1.15
        height_in: 3.9
    notes: >-
      [1:00] And here's the app. Slash to search, and I type it the way I
      remember it: rehearsing a database move with fake data. The note never
      says "fake data". It's the top result, and the preview shows the note.
      Enter, and it opens in my editor. The keys are in the bottom bar, like
      lazygit, and q quits. That's the note I couldn't find at the start.

  - layout: title-body-dark
    title: One line in CLAUDE.md, and my agent asks the index
    pictures:
      - image: talk/captures/claude-md.png
        left_in: 0.9
        top_in: 1.25
        width_in: 8.2
    textboxes:
      - text: "Without the line: grep and read, $0.43\nWith the line: ask the index first, $0.25"
        left_in: 0.9
        top_in: 3.1
        width_in: 8.2
        height_in: 1.0
        size_pt: 24
        bold: true
        color: electric_eel
      - text: "Same app, same question, one run each"
        left_in: 0.9
        top_in: 4.2
        width_in: 8.2
        height_in: 0.4
        size_pt: 14
        color: white
    notes: >-
      [0:45] Now back to my coding agent. Asked for the note, it grepped and
      read files, the old way, because it didn't know the index existed. So I
      added one line to CLAUDE.md, the agent's memory file. Same question: it
      asks the index first, finds the note, and reads only that section.
      About 40 percent cheaper, in one run each. Those are the tokens I
      wanted back for code.

  # Beat 9: The guardrails held (1:15)
  - layout: title-body-dark
    title: The harness stopped a delete the database allowed
    textboxes:
      - text: "DELETE FROM notes_app.account"
        left_in: 0.8
        top_in: 1.25
        width_in: 8.4
        height_in: 0.55
        size_pt: 24
        font: Courier New
        color: electric_eel
      - text: "No WHERE clause. The foreign keys cascade to every other table."
        left_in: 0.8
        top_in: 1.9
        width_in: 8.4
        height_in: 0.5
        size_pt: 18
        color: white
      - text: "“Permission for this action was denied by the Claude Code auto mode classifier. Reason: [Cloud Storage Mass Delete].”"
        left_in: 0.8
        top_in: 2.75
        width_in: 8.4
        height_in: 1.2
        size_pt: 20
        font: Georgia
        color: blue_lagoon
    notes: >-
      [0:40] For everyone who decides what an agent is allowed to run. While I
      was resetting a sandbox for this talk, the agent tried this: delete
      everything in the table, no where clause, and the foreign keys take
      every other table with it. The database would have run it. The account
      had the privilege. The harness stopped it before it reached the server,
      and told the agent to find a safer way or ask me. It found a safer way.

  - layout: three-column
    title: Three layers decide what the agent can run
    heading1: The allow-list
    body1:
      - Which folders and database servers the agent can reach
      - Set by you, with mcp setup
    heading2: The harness
    body2:
      - Which actions the agent can take
      - Stopped this delete
    heading3: The database grants
    body3:
      - What the account may do
      - Would have allowed it
    notes: >-
      [0:35] Three layers, and each one can say no on its own. The allow-list
      you set up once. The harness, which looks at what the agent is about to
      do. And the database grants. The grants would have allowed this one. The
      harness caught it. Use all three, and you don't have to rely on the
      agent's judgment.

  # Beat 10: What I'd tell you (2:15)
  - layout: title-body
    title: Five habits made the agent's work easy to trust
    body:
      - Write down what the app does, and the check it must pass
      - "Name the files, number the steps, and say \"in order\""
      - Load how your database does it, and look for the Skill line
      - Give the agent a sandbox to try its work on
      - Run the check yourself
    notes: >-
      [1:00] So here's what I'd tell you. Write down what the app does, and
      the check it has to pass. That one line is how the agent knew it was
      done, and how I know it works.
      Name the files, number the steps, say in order. Load how your database
      does it, and look for the Skill line, because a small agent may not
      load it for you. Give the agent a sandbox, so it tries its work on a
      real server. And run the check yourself.

  - layout: title-body
    title: What stays after the session, and where to start
    body:
      - "The sandbox: still running on port 3310, with its data in working/sandbox"
      - "The allow-list: the folders and servers you added with mcp setup"
      - "The CLAUDE.md line: my agent uses the index from now on"
      - "Start on something new, where nothing existing is at risk"
    notes: >-
      [0:45] Know what the agent leaves behind. When the conversation ends,
      the sandbox keeps running, on its port, with its data on your disk.
      Stop it when you're done, or keep it, like I did, because it's my index
      now. The allow-list stays as you set it. And the line in CLAUDE.md
      means every future session knows about the index. Where to start?
      Something new. A tool you've wanted, where there's no existing code to
      break.

  - layout: thank-you
    title: Go build the tool you've been missing, on open source you own
    notes: >-
      [0:30] That crazy idea is now a terminal app I use every day. So go
      build the tool you've been missing. An afternoon, on open source you
      own and control, doing exactly what you want. The spec, the notes, and
      the prompts are in the repository on the last slide. If we have a few
      minutes, I'll show you the run.

  # Beat 11: Demo, if time (3:00 to 5:00)
  # Stand-in until the fresh recording exists.
  - layout: section-granite
    title: "Demo: from the spec to a working search"
    notes: >-
      [3:00 to 5:00] Play the recorded cut of run rec-2026-10c, README
      Prompts 1 and 2. Then live: uv run notes-app, press slash, type
      "rehearsing a database move with fake data", and press Enter on the
      April 14 note to open nvim. Quit nvim, then q. If anything fails,
      slides 20 and 21 already show the result.

  - layout: end
    url: |
      github.com/maglietti/notes-app-demo
      ai-plugins.mariadb.org
    notes: >-
      Thank you. Questions? If someone asks about the REST tier from the
      original abstract: I cut it from my spec, because my app didn't need it
      and the server that would serve it isn't ready yet. Cutting scope is a
      spec decision too. If someone asks whether a bigger agent needs the
      skills: Claude Opus 5.5 wrote MariaDB's vector SQL correctly without
      them in my runs, so the small agent is where the skills matter most.
