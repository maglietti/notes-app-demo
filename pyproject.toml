[project]
name = "notes-app"
version = "0.1.0"
description = "Textual terminal client for the notes_app MariaDB schema"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "mariadb>=1.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.scripts]
notes-app = "notes_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The repository gitignores notes_app/ (it is generated), and hatchling skips
# VCS-ignored files by default, which would ship an empty wheel.
ignore-vcs = true

[tool.hatch.build.targets.wheel]
packages = ["notes_app"]
